<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .add-btn {
            background: #667eea;
        }

        .add-btn:hover {
            background: #5368d5;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        #taskList li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f6fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        #taskList li span {
            flex: 1;
        }

        #taskList li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: #e74c3c;
            padding: 8px 10px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        #emptyMessage {
            text-align: center;
            color: #888;
            padding: 15px 0;
        }

        .task-count {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }

        .clear-btn {
            display: block;
            margin: 15px auto 0;
            background: #555;
        }

        .clear-btn:hover {
            background: #333;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📝 My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time!</p>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                maxlength="200"
            >
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

        <p class="task-count" id="taskCount">0 tasks remaining</p>

        <button class="clear-btn" onclick="clearTasks()">
            Clear All Tasks
        </button>

        <footer>To-Do List App | Built with HTML, CSS & JavaScript</footer>
    </div>

    <script>
        // Load saved tasks from the browser
        let tasks = [];

        try {
            tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
            if (!Array.isArray(tasks)) {
                tasks = [];
            }
        } catch (error) {
            tasks = [];
        }

        // Save tasks in browser storage
        function saveTasks() {
            try {
                localStorage.setItem("myTasks", JSON.stringify(tasks));
            } catch (error) {
                alert("Unable to save tasks in this browser.");
            }
        }

        // Display all tasks
        function showTasks() {
            const taskList = document.getElementById("taskList");
            const emptyMessage = document.getElementById("emptyMessage");
            const taskCount = document.getElementById("taskCount");

            taskList.innerHTML = "";

            emptyMessage.style.display =
                tasks.length === 0 ? "block" : "none";

            tasks.forEach(function(task, index) {
                const li = document.createElement("li");

                if (task.completed) {
                    li.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                checkbox.addEventListener("change", function() {
                    tasks[index].completed = checkbox.checked;
                    saveTasks();
                    showTasks();
                });

                const span = document.createElement("span");
                span.textContent = task.text;

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", function() {
                    deleteTask(index);
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteButton);

                taskList.appendChild(li);
            });

            const remaining = tasks.filter(function(task) {
                return !task.completed;
            }).length;

            taskCount.textContent =
                remaining + (remaining === 1
                    ? " task remaining"
                    : " tasks remaining");
        }

        // Add a new task
        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            saveTasks();
            showTasks();

            input.value = "";
            input.focus();
        }

        // Delete a task
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            showTasks();
        }

        // Delete all tasks
        function clearTasks() {
            if (tasks.length === 0) {
                alert("There are no tasks to clear.");
                return;
            }

            if (confirm("Are you sure you want to delete all tasks?")) {
                tasks = [];
                saveTasks();
                showTasks();
            }
        }

        // Add task when Enter is pressed
        document.getElementById("taskInput").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    addTask();
                }
            }
        );

        // Show saved tasks when the website opens
        showTasks();
    </script>

</body>
</html>
